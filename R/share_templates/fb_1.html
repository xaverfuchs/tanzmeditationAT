<!doctype html>
<!-- Facebook, eine Wave (1200 x 630). Platzhalter in {{ }} füllt das R-Skript. -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 1200px; height: 630px; display: flex; }
  .bild { width: 630px; height: 630px; object-fit: cover; display: block; }
  .text { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 44px; line-height: 1.1; }
  .datum { font-size: 52px; }
  .ort   { font-size: 38px; margin-top: 16px; }
  .info  { font-size: 26px; font-weight: 700; margin-top: 16px; }
  .web   { font-family: "Open Sans", sans-serif; font-size: 30px; margin-top: 30px; }
</style></head>
<body>
  <img class="bild" src="../../static{{image1}}">
  <div class="text">
    <div class="plakat datum">{{weekday1}},<br>{{day1}}</div>
    <div class="plakat ort">{{time1}}<br>{{place1}}</div>
    <div class="plakat info">{{details1}}</div>
    <div class="web">tanzmeditation.at</div>
  </div>
</body></html>
