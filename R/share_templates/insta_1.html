<!doctype html>
<!-- Instagram, eine Wave (1080 x 1350). Platzhalter in {{ }} füllt das R-Skript. -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 1080px; height: 1350px; display: flex; flex-direction: column; }
  .bild { width: 1080px; height: 1080px; object-fit: cover; display: block; }
  .text { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
          text-align: center; line-height: 1.08; }
  .datum { font-size: 70px; }
  .ort   { font-size: 54px; margin-top: 8px; }
  .info  { font-size: 32px; font-weight: 700; margin-top: 10px; }
  .web   { font-family: "Open Sans", sans-serif; font-size: 34px; margin-top: 8px; }
</style></head>
<body>
  <img class="bild" src="../../static{{image1}}">
  <div class="text">
    <div class="plakat datum">{{date1}}</div>
    <div class="plakat ort">{{start1}} · {{place1}}</div>
    <div class="plakat info">{{details1}}</div>
    <div class="web">tanzmeditation.at</div>
  </div>
</body></html>
