<!doctype html>
<!-- Facebook, zwei Waves (1200 x 630). Platzhalter in {{ }} füllt das R-Skript. -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
  body { width: 1200px; height: 630px; display: flex; flex-direction: column; }
  header { height: 150px; display: flex; align-items: center; justify-content: center; gap: 26px; }
  header img { width: 84px; height: 84px; }
  h1 { font-size: 44px; }
  .sub { font-size: 28px; margin-top: 4px; }
  main { flex: 1; padding: 0 46px; display: flex; gap: 40px; align-items: center; }
  .wave { flex: 1; display: flex; gap: 24px; align-items: flex-start; }
  .wave img { width: 250px; height: 250px; object-fit: cover; }
  h2 { font-size: 26px; margin-bottom: 12px; }
  .zeile { font-size: 20px; margin-bottom: 3px; }
  .trenner { align-self: stretch; margin: 30px 0; border-left: 1px solid #8C8C8C; }
  footer { text-align: center; font-size: 22px; padding-bottom: 22px; }
</style></head>
<body class="light">
  <header class="dark">
    <img src="../../static/images/logo_splash.png">
    <div><h1 class="gold">{{title}}</h1><div class="sub">{{subtitle}}</div></div>
  </header>
  <main>
    <div class="wave">
      <img class="shadow" src="../../static{{image1}}">
      <div><h2>{{name1}}</h2><div class="zeile"><b>{{date1}}</b></div><div class="zeile">{{time1}}</div>
           <div class="zeile">{{place1}}</div><div class="zeile">{{extra1}}</div><div class="zeile">{{price1}}</div></div>
    </div>
    <div class="trenner"></div>
    <div class="wave">
      <img class="shadow" src="../../static{{image2}}">
      <div><h2>{{name2}}</h2><div class="zeile"><b>{{date2}}</b></div><div class="zeile">{{time2}}</div>
           <div class="zeile">{{place2}}</div><div class="zeile">{{extra2}}</div><div class="zeile">{{price2}}</div></div>
    </div>
  </main>
  <footer>Alle Infos: <span class="url">tanzmeditation.at</span></footer>
</body></html>
